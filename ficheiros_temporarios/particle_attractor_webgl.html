<!DOCTYPE html>
<html lang="en">

<head>
    <title>Three.js WebGL - Attractors Particles (GPGPU)</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <style>
        body {
            margin: 0;
            background-color: #000;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GPUComputationRenderer } from 'three/addons/misc/GPUComputationRenderer.js';

        // --- Configuração ---
        const WIDTH = 1024;
        const PARTICLES = WIDTH * WIDTH;

        // --- Shaders para a Simulação (GPGPU) ---

        // Fragment Shader para calcular a Posição
        const fragmentShaderPosition = `
            uniform float time;
            uniform float delta;

            void main() {
                vec2 uv = gl_FragCoord.xy / resolution.xy;
                vec4 tmpPos = texture2D(texturePosition, uv);
                vec3 pos = tmpPos.xyz;
                vec4 tmpVel = texture2D(textureVelocity, uv);
                vec3 vel = tmpVel.xyz;

                pos += vel * delta;

   
                gl_FragColor = vec4(pos, 1.0);
            }
        `;

        // Fragment Shader para calcular a Velocidade (A física pesada está aqui)
        const fragmentShaderVelocity = `
            uniform float time;
            uniform float delta;
            
            // Dados dos atratores
            uniform vec3 attractorPos[3];
            uniform vec3 attractorAxis[3]; // Eixo de rotação para o spin
            
            // Constantes físicas (ajustadas para WebGL scale)
            const float G = 50.0; 
            const float maxSpeed = 8.0;
            const float damp = 0.98; // Simula a resistência do ar
            const float spinStrength = 2.0;

            void main() {
                vec2 uv = gl_FragCoord.xy / resolution.xy;
                vec3 pos = texture2D(texturePosition, uv).xyz;
                vec3 vel = texture2D(textureVelocity, uv).xyz;

                vec3 force = vec3(0.0);

                // Loop pelos 3 atratores
                for(int i = 0; i < 3; i++) {
                    vec3 target = attractorPos[i];
                    vec3 axis = attractorAxis[i];
                    
                    vec3 diff = target - pos;
                    float dist = length(diff);
                    vec3 dir = normalize(diff);

                    // Evitar divisão por zero ou forças explosivas
                    dist = max(dist, 0.5); 

                    // Força Gravitacional (Pull)
                    // F = G * m1 * m2 / dist^2 (Simplificado)
                    float gravity = G / (dist * dist);
                    force += dir * gravity;

                    // Força de Rotação (Spin)
                    // Produto vetorial entre a gravidade (orientada pelo eixo) e a direção
                    vec3 spinForce = cross(axis, diff);
                    force += normalize(spinForce) * (gravity * spinStrength);
                }

                vel += force * delta;

                // Limitar velocidade máxima
                float speed = length(vel);
                if (speed > maxSpeed) {
                    vel = normalize(vel) * maxSpeed;
                }

                // Damping (atrito)
                vel *= damp;

                gl_FragColor = vec4(vel, 1.0);
            }
        `;

        // --- Shader de Renderização (Visual) ---

        const vertexShaderRender = `
            uniform sampler2D texturePosition;
            uniform sampler2D textureVelocity;
            varying vec3 vVelocity;
            varying float vSpeed;

            void main() {
                // Ler a posição calculada pelo GPGPU
                vec4 posTex = texture2D(texturePosition, position.xy);
                vec3 pos = posTex.xyz;
                
                // Ler velocidade para colorir
                vec3 vel = texture2D(textureVelocity, position.xy).xyz;
                vVelocity = vel;
                vSpeed = length(vel);

                vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                gl_Position = projectionMatrix * mvPosition;
                
                // Tamanho do ponto baseado na profundidade
                gl_PointSize = (2.0 / -mvPosition.z) * 15.0; 
            }
        `;

        const fragmentShaderRender = `
            varying vec3 vVelocity;
            varying float vSpeed;

            void main() {
                // Cores baseadas na velocidade (Roxo a Laranja/Branco)
                vec3 colorA = vec3(0.35, 0.0, 1.0); // Roxo
                vec3 colorB = vec3(1.0, 0.65, 0.45); // Laranja claro

                float t = smoothstep(0.0, 8.0, vSpeed);
                vec3 finalColor = mix(colorA, colorB, t);

                // Fazer a partícula redonda
                vec2 coord = gl_PointCoord - vec2(0.5);
                if(length(coord) > 0.5) discard;

                gl_FragColor = vec4(finalColor, 1.0);
            }
        `;

        // --- Inicialização ---

        let scene, camera, renderer, controls;
        let gpuCompute;
        let velocityVariable, positionVariable;
        let material, mesh;
        let uniformAttractors, uniformAttractorAxes;
        const CLOUD_RADIUS = 10.0;
        const aspect = window.innerWidth / window.innerHeight;
        const isLandscape = aspect > 1.0;
        const spread = isLandscape ? (CLOUD_RADIUS * aspect / 2) : CLOUD_RADIUS / 2;
        const debugMeshes = [];

        // "baseSpread" é a distância média ao centro
        const baseSpread = (CLOUD_RADIUS * (1.0 / aspect) ) * 0.45; // 45% do raio

        // "ampLong" = Amplitude no eixo comprido (X no PC, Y no Mobile)
        // Vamos dizer que ele pode oscilar 40% do tamanho do spread
        const ampLong = spread * 0.6;

        // "ampShort" = Amplitude no eixo curto (Y no PC, X no Mobile)
        // Baseado no raio original sem o aspect ratio
        const ampShort = CLOUD_RADIUS * 0.35;

        // Profundidade (Z) pode ser consistente
        const ampDepth = isLandscape ? CLOUD_RADIUS * 0.35 : spread;



        console.log("isLandscape?", isLandscape);
        console.log("Spread:", spread);

        const randPhase = [ // (entre 10 e 100)
            10 + Math.random() * 90,
            10 + Math.random() * 90,
            10 + Math.random() * 90
        ];

        const randSpeed = [ // (entre 0.75x e 1.25x)
            0.75 + Math.random() * 0.5,
            0.75 + Math.random() * 0.5,
            0.75 + Math.random() * 0.5
        ];

        init();
        animate();

        function initDebug() {
            // Geometria simples (pequena para não tapar tudo)
            const geometry = new THREE.SphereGeometry(0.5, 16, 16);
            const material = new THREE.MeshBasicMaterial({ color: 0xff0000, wireframe: false }); // Vermelho

            for (let i = 0; i < 3; i++) {
                const mesh = new THREE.Mesh(geometry, material);
                scene.add(mesh);
                debugMeshes.push(mesh);
            }
        }

        function init() {
            // 1. Setup Básico
            const container = document.createElement('div');
            document.body.appendChild(container);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 30);

            scene = new THREE.Scene();

            renderer = new THREE.WebGLRenderer({ antialias: false }); // Antialias off para performance
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000);
            container.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            // 2. Setup GPGPU (A magia acontece aqui)
            initGPGPU();

            // 3. Setup Partículas Visuais
            initParticles();

            initDebug();

            // 4. Listeners
            window.addEventListener('resize', onWindowResize);
        }

        function initGPGPU() {
            gpuCompute = new GPUComputationRenderer(WIDTH, WIDTH, renderer);

            // Se for mobile ou browser fraco, usar HalfFloat
            if (renderer.capabilities.isWebGL2 === false) {
                gpuCompute.setDataType(THREE.HalfFloatType);
            }

            const dtPosition = gpuCompute.createTexture();
            const dtVelocity = gpuCompute.createTexture();

            fillTextures(dtPosition, dtVelocity);

            velocityVariable = gpuCompute.addVariable("textureVelocity", fragmentShaderVelocity, dtVelocity);
            positionVariable = gpuCompute.addVariable("texturePosition", fragmentShaderPosition, dtPosition);

            // Dependências (Velocity precisa de Position, Position precisa de Velocity)
            gpuCompute.setVariableDependencies(velocityVariable, [positionVariable, velocityVariable]);
            gpuCompute.setVariableDependencies(positionVariable, [positionVariable, velocityVariable]);

            // Uniforms iniciais
            uniformAttractors = { value: [new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()] };
            uniformAttractorAxes = { value: [new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, 1, 0), new THREE.Vector3(1, 0, 0)] };

            velocityVariable.material.uniforms.time = { value: 0.0 };
            velocityVariable.material.uniforms.delta = { value: 0.0 };
            velocityVariable.material.uniforms.attractorPos = uniformAttractors;
            velocityVariable.material.uniforms.attractorAxis = uniformAttractorAxes;

            positionVariable.material.uniforms.time = { value: 0.0 };
            positionVariable.material.uniforms.delta = { value: 0.0 };

            const error = gpuCompute.init();
            if (error !== null) {
                console.error(error);
            }
        }

        function fillTextures(texturePos, textureVel) {
            const posArray = texturePos.image.data;
            const velArray = textureVel.image.data;

            // Calcula o racio do ecrã (ex: 1.77 para 16:9)

            console.log("Aspect Ratio:", aspect);

            for (let i = 0; i < posArray.length; i += 4) {
                // 1. Gerar vetor aleatório esférico
                let x = Math.random() * 2 - 1;
                let y = Math.random() * 2 - 1;
                let z = Math.random() * 2 - 1;

                const mag = Math.sqrt(x * x + y * y + z * z) || 1;

                // Distribuição de volume
                const r = Math.random() * CLOUD_RADIUS;

                // 2. Aplicar a elipse baseada no ecrã
                // Multiplicamos o X pelo 'aspect' para esticar horizontalmente
                posArray[i + 0] = (x / mag) * r * aspect;
                posArray[i + 1] = (y / mag) * r;
                posArray[i + 2] = isLandscape ? (z / mag) * r : (z / mag) * r * aspect; // O Z (profundidade) costuma ficar igual ao Y
                posArray[i + 3] = 1;

                // Velocidade inicial (opcional: podes dar um twist aqui também)
                velArray[i + 0] = (Math.random() - 0.5) * 0.1;
                velArray[i + 1] = (Math.random() - 0.5) * 0.1;
                velArray[i + 2] = (Math.random() - 0.5) * 0.1;
                velArray[i + 3] = 1;
            }
        }

        function initParticles() {
            // Criar geometria baseada em índices UV
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(PARTICLES * 3);

            // "Hack": Usamos o atributo position para guardar as coordenadas UV
            // para ler a textura, e não a posição 3D real (essa vem do shader).
            let p = 0;
            for (let i = 0; i < WIDTH; i++) {
                for (let j = 0; j < WIDTH; j++) {
                    positions[p++] = j / (WIDTH - 1); // U
                    positions[p++] = i / (WIDTH - 1); // V
                    positions[p++] = 0;
                }
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            material = new THREE.ShaderMaterial({
                uniforms: {
                    texturePosition: { value: null },
                    textureVelocity: { value: null }
                },
                vertexShader: vertexShaderRender,
                fragmentShader: fragmentShaderRender,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                transparent: true
            });

            mesh = new THREE.Points(geometry, material);
            scene.add(mesh);
        }

        function onWindowResize() {
            camera.aspect = aspect;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now() * 0.001;
            const delta = 0.016;

            if (isLandscape) {
                // --- MODO LAPTOP (Horizontal) ---



                // Atrator 1: Lado Esquerdo (Move-se organicamente na zona esquerda)
                uniformAttractors.value[0].set(
                    -spread + Math.sin((time + randPhase[0] * 0.6) * randSpeed[0]) * ampLong,
                    Math.cos((time + randPhase[0] * 0.8) * randSpeed[0]) * ampShort,
                    Math.sin((time + randPhase[0] * 1.2) * randSpeed[0]) * ampDepth
                );

                // Atrator 2: Lado Direito (Move-se organicamente na zona direita)
                uniformAttractors.value[1].set(
                    spread + Math.cos((time + randPhase[1] * 0.7) * randSpeed[1]) * ampLong,   // Base +6 (Dir) + Oscilação diferente
                    Math.sin((time + randPhase[1] * 0.5) * randSpeed[1]) * ampShort,         // Sobe e desce mais lento e amplo
                    Math.cos((time + randPhase[1] * 0.9) * randSpeed[1]) * ampDepth         // Profundidade diferente
                );

            } else {
                // --- MODO MOBILE (Vertical) ---
                // (Mantive a tua lógica vertical que já separava Topo/Baixo)

                // Atrator 1: Topo
                uniformAttractors.value[0].set(
                    Math.sin((time + randPhase[0] * 0.5) * randSpeed[0]) * ampShort,
                    spread + Math.cos((time + randPhase[0] * 0.3) * randSpeed[0]) * ampLong,
                    Math.sin((time + randPhase[0] * 0.2) * randSpeed[0]) * ampDepth
                );


                // Atrator 2: Baixo
                uniformAttractors.value[1].set(
                    Math.cos((time + randPhase[1] * 0.4) * randSpeed[1]) * ampShort,
                    -spread + Math.sin((time + randPhase[1] * 0.5) * randSpeed[1]) * ampLong,
                    Math.cos((time + randPhase[1] * 0.3) * randSpeed[1]) * ampDepth
                );


            }

            // Atrator 3: O "Caos" (Vagueia pelo centro em qualquer modo)
            // Faz um 'figure 8' (o infinito) para interagir com os outros dois
            uniformAttractors.value[2].set(
                Math.sin((time + randPhase[2] * 1.2) * randSpeed[2]) * (isLandscape ? ampLong * 1.5 : ampShort * 1.5), // Mais largo em landscape
                Math.sin((time + randPhase[2] * 0.7) * randSpeed[2]) * (isLandscape ? ampShort * 1.5 : ampLong * 1.5), // Mais alto em portrait
                Math.cos((time + randPhase[2] * 0.9) * randSpeed[2]) * ampDepth
            );


            const debugAttractors = true;
            for (let i = 0; i < 3; i++) {
                debugMeshes[i].visible = debugAttractors;
                if (debugAttractors) {
                    debugMeshes[i].position.copy(uniformAttractors.value[i]);
                }
            }


            // --- Atualizar GPGPU ---
            velocityVariable.material.uniforms.time.value = time;
            velocityVariable.material.uniforms.delta.value = delta;
            positionVariable.material.uniforms.time.value = time;
            positionVariable.material.uniforms.delta.value = delta;

            gpuCompute.compute();

            material.uniforms.texturePosition.value = gpuCompute.getCurrentRenderTarget(positionVariable).texture;
            material.uniforms.textureVelocity.value = gpuCompute.getCurrentRenderTarget(velocityVariable).texture;

            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>

</html>
