<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/imgs/favicon.png" />
  <link rel="stylesheet" href="palette_style.css">
  <script src="global.js" defer></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Palette</title>

  <!-- p5.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <!-- chroma.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/2.4.2/chroma.min.js"></script>
  <!-- O TEU JS -->
  <script src="colorpalette.js" defer></script>
</head>
<body>
  <div class="topbar" role="banner">
    <div class="brand">
      <div class="brand-dot" aria-hidden="true"></div>
      <div class="brand-title">Color Palette</div>
    </div>
    <div class="actions" role="toolbar" aria-label="Palette actions">
      <button class="btn" id="btn-new" type="button">Nova</button>
      <button class="btn" id="btn-save" type="button">Guardar</button>
      <label class="file-btn" for="image-input">
        <span>Imagem</span>
        <input id="image-input" type="file" accept="image/*">
      </label>
    </div>
  </div>

  <div class="shell">
    <main class="canvas-panel" aria-label="Paleta atual">
      <div id="sketch-container"></div>
    </main>
    <aside class="panel saved-panel" aria-label="Paletas guardadas">
      <div class="panel-header">
        <div class="panel-title">Paletas guardadas</div>
        <button class="btn btn-small" id="btn-clear-saved" type="button">Limpar</button>
      </div>
      <div class="panel-body">
        <div id="saved-empty" class="muted">Sem paletas guardadas</div>
        <div id="saved-list" class="saved-list" role="list"></div>
      </div>
    </aside>
  </div>
</body>
</html>
