<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/imgs/favicon.png" />
    <link rel="stylesheet" href="sound_style.css">
    <script src="global.js" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoodKit</title>
</head>

<body>


    <div id="main">
        <h1 class="title">AUDIO</h1>

        <div class="sound-bubble fire-main">
            <span style="font-size: 4rem;">🔥</span>
        </div>
        <div class="sound-bubble fire-small">
            <span style="font-size: 2rem;">🕯️</span>
        </div>

        <div class="sound-bubble rain">
            <span style="font-size: 5rem; color: white;">🌧️</span>
        </div>
        <div class="sound-bubble water">
            <span style="font-size: 3rem; color: white;">💧</span>
        </div>
        <div class="sound-bubble thunder">
            <span style="font-size: 2rem;">🌩️</span>
        </div>

        <div class="sound-bubble forest">
            <span style="font-size: 5rem; color: white;">🌲</span>
        </div>
        <div class="sound-bubble bird">
            <span style="font-size: 2rem;">🐦</span>
        </div>
        <div class="sound-bubble leaves">
            <span style="font-size: 2.5rem;">🍃</span>
        </div>
        <div class="sound-bubble wind">
            <span style="font-size: 2.5rem;">💨</span>
        </div>

        <div class="master-control">
            <span>-</span>
            <div class="slider-track">
                <div class="slider-fill"></div>
            </div>
            <span>+</span>
        </div>

    </div>

    <footer>
        <div class="language-select">
            <span>🌐</span> English ⌄
        </div>
        <div class="copyright">
            Copyright © 2025. All rights reserved.
        </div>
    </footer>

</body>

</html>
